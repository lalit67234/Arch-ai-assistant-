name: ARCH Native Android APK Build (Zero-Cost CI)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger from GitHub web UI / Android browser!

jobs:
  build-apk:
    name: Build ARCH Native Android APK (Android 9+ / API 28-34)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Frontend Dependencies & Build Web Assets
        run: |
          npm ci
          npm run build

      - name: Copy Production Web Assets to Android Assets Directory
        run: |
          mkdir -p android/app/src/main/assets/dist
          cp -r dist/* android/app/src/main/assets/dist/
          echo "Successfully bundled web assets into Android project."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Execute Permission to Gradle Wrapper
        run: |
          cd android
          chmod +x gradlew || true

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Rename APK for Easy Phone Installation
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/ARCH-v3.0.0-debug.apk

      - name: Upload APK Artifact (Direct Download to Android Phone)
        uses: actions/upload-artifact@v4
        with:
          name: ARCH-v3.0.0-debug-APK
          path: build-output/ARCH-v3.0.0-debug.apk
          retention-days: 14
