name: ARCH Native Android APK Build

on:
push:
branches: [main, master]
pull_request:
branches: [main, master]
workflow_dispatch:

permissions:
contents: read

jobs:
build-apk:
name: Build ARCH Native Android APK
runs-on: ubuntu-24.04

steps:
  - name: Checkout Repository
    uses: actions/checkout@v4

  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: 20
      cache: npm

  - name: Install Frontend Dependencies and Build
    run: |
      npm ci
      npm run build

  - name: Copy Web Assets
    run: |
      test -d dist
      mkdir -p android/app/src/main/assets/dist
      cp -a dist/. android/app/src/main/assets/dist/

  - name: Set up JDK 17
    uses: actions/setup-java@v5
    with:
      distribution: temurin
      java-version: '17'
      cache: gradle

  - name: Setup Android SDK
    uses: android-actions/setup-android@v3
    with:
      packages: |
        platform-tools
        platforms;android-35
        build-tools;35.0.0

  - name: Verify Android SDK
    run: |
      echo "ANDROID_HOME=$ANDROID_HOME"
      adb version
      sdkmanager --list_installed

  - name: Build Android Debug APK
    run: |
      cd android
      chmod +x gradlew
      ./gradlew --version
      ./gradlew assembleDebug --stacktrace

  - name: Prepare APK Artifact
    run: |
      test -f android/app/build/outputs/apk/debug/app-debug.apk
      mkdir -p build-output
      cp android/app/build/outputs/apk/debug/app-debug.apk \
        build-output/ARCH-v3.0.0-debug.apk

  - name: Upload APK Artifact
    uses: actions/upload-artifact@v4
    with:
      name: ARCH-v3.0.0-debug-APK
      path: build-output/ARCH-v3.0.0-debug.apk
      if-no-files-found: error
      retention-days: 14
